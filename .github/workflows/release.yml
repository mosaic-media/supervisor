name: release

# Publishes the `mosaic-supervisor` binary for every supported target on a
# version tag, e.g. v0.1.0.
#
# **This is the binary a supervised install installs** (supervisor#6): a user runs
# the Supervisor, and it fetches the Platform and the Shell. Until this workflow
# existed nothing built it outside a developer's container — the entry point to
# the whole product was the one artefact with no release.
#
# It mirrors `platform`'s release.yml and `web`'s release-shell.yml — same five
# targets, CGO off so they cross-compile from one runner, per-file checksums
# rolled into one SHA256SUMS — because the three artefacts are verified the same
# way by the same code and should not be produced three different ways.
#
# **Signing is what this leaves out, and the Supervisor is the one repository
# where that matters twice**: it is the artefact nothing verifies (a user
# downloads it, and there is no process below it to check a signature), and it
# is also the *verifier* of the other two. platform#76 decides the key hierarchy;
# the key itself is custody work that has to happen off CI. `artefact.go`
# already refuses to activate anything it cannot verify, so what is missing is
# a key rather than a code path.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mosaic-supervisor

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release must be pre-proven. The ordinary gate, against the tagged commit.
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # No `-tags mosaicdev`, and that is the whole guard: a released Supervisor
      # does not contain the code that reads MOSAIC_DEV_RELEASE_KEY, so the
      # development override is absent rather than switched off. `trust_off.go`
      # is what compiles into these binaries.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="mosaic-supervisor-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && name="${name}.exe"
          go build -trimpath -ldflags "-s -w" -o "dist/${name}" ./cmd/mosaic-supervisor
          ( cd dist && sha256sum "${name}" > "${name}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-supervisor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksums file over every binary — the same shape the Supervisor's
      # own VerifyArtefact consumes for the artefacts it downloads, so the three
      # releases in this project are all verified by one parser.
      - name: Assemble checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          echo "--- release assets ---"; ls -la

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME}"
          gh release create "$version" --title "$version" --generate-notes --verify-tag \
            dist/mosaic-supervisor-* dist/SHA256SUMS

  # The two supervised images (supervisor#6), built FROM the binaries this workflow
  # already produced — packaging artefacts, not a second build, so a container
  # deployment and a bare-metal one run identical bytes (platform#50).
  #
  # `full` is tagged plainly as well as by name, because it is the default and
  # the one the documentation shows first: `docker run ghcr.io/…/mosaic-supervisor`
  # should be the working thing rather than the one that needs a database.
  images:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push lite
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}-lite
            ${{ env.IMAGE }}:lite

      - name: Build and push full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}-full
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:full
            ${{ env.IMAGE }}:latest
