<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Mosaic</title>
<!--
  The embedded recovery renderer (ADR 0005's third rung).

  **The Supervisor renders; this swaps.** htmx is hypermedia, so the HTML comes
  from RecoveryFragment — the same SDUI tree a native client renders in its own
  skin and the Shell renders from /supervisor/ui. One renderer, no component
  model in the browser, nothing to drift.

  **Three rungs inside this page, because the Supervisor is the thing that might
  be failing.** SSE says "changed" and htmx re-fetches; a 5-second poll runs
  regardless, so a blocked or dead stream costs latency and not the page; and
  with no scripting at all a meta refresh reloads it, since the whole content is
  a state that changes. The fragment always arrives by hx-get, so all three
  rungs share one content path.

  **Nothing is fetched off this origin.** htmx and its SSE extension are
  vendored into the binary — see vendor/README.md. The page draws when there may
  be no route to the internet configured at all.
-->
<noscript><meta http-equiv="refresh" content="5"></noscript>
<style>
  :root {
    --bg: #f6f6f7; --fg: #1a1a1e; --muted: #55555f; --faint: #85858f;
    --line: #dededf; --accent: #6b5cff; --danger: #d4444f; --track: #e2e2e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171b; --fg: #f2f2f4; --muted: #a6a6b0; --faint: #74747f;
      --line: #2a2a31; --accent: #8a7bff; --danger: #ff6b73; --track: #2a2a31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 1.5rem;
  }
  #state { width: 100%; }
  .box { display: flex; flex-direction: column; margin: 0 auto; }
  .box.row { flex-direction: row; }
  .box.center { align-items: center; text-align: center; }
  .box.gap-2 { gap: .5rem; } .box.gap-4 { gap: 1rem; } .box.gap-8 { gap: 2rem; }
  .box.p-4 { padding: 1rem; } .box.p-8 { padding: 2rem; }
  p { margin: 0; max-width: 33rem; }
  /* The style scale this renderer carries. Deliberately small: it has no design
     tokens — those are Platform-delivered (ADR 0040) and there is no Platform
     in the states it draws — so it owns a few sizes rather than pretending to
     the real skin. */
  .v-xs { font-size: .75rem; } .v-sm { font-size: .875rem; }
  .v-md { font-size: 1rem; } .v-2xl { font-size: 1.5rem; letter-spacing: -.02em; }
  .w-bold { font-weight: 700; }
  .c-text-muted { color: var(--muted); } .c-text-faint { color: var(--faint); }
  .bar { width: 100%; max-width: 20rem; height: 6px; border-radius: 999px;
         background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px;
             background: var(--accent); transition: width .3s ease; }
  .bar.danger > i { background: var(--danger); }
  .icon { width: 2rem; height: 2rem; display: grid; place-items: center;
          border-radius: 999px; border: 1px solid var(--line); font-size: 1rem; }
  .spin { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  #unreachable { display: none; color: var(--faint); font-size: .875rem;
                 text-align: center; margin-top: 1rem; }
  body.unreachable #state { opacity: .5; }
  body.unreachable #unreachable { display: block; }
</style>
<script src="/supervisor/static/htmx.min.js" defer></script>
<script src="/supervisor/static/sse.js" defer></script>
</head>
<body hx-ext="sse" sse-connect="/supervisor/ui/events">
  <div>
    <!--
      One content path for all three rungs: the fragment always arrives by
      hx-get. SSE only signals that something changed, so a stream blocked or
      buffered by something in the middle costs latency rather than the page.

      The initial content is server-rendered, so the first paint is the real
      state rather than an empty box waiting for a fetch — and it is what a
      browser with scripting off keeps, refreshed by the meta above.
    -->
    <div id="state"
         hx-get="/supervisor/ui/fragment"
         hx-trigger="every 5s, sse:state"
         hx-swap="innerHTML"
         aria-live="polite">{{fragment}}</div>
    <p id="unreachable">Cannot reach this Mosaic. It may be restarting — this page keeps trying.</p>
  </div>
<script>
  // The three things htmx does not express declaratively, and nothing else.
  addEventListener("htmx:responseError", unreachable);
  addEventListener("htmx:sendError", unreachable);
  addEventListener("htmx:afterOnLoad", function () {
    document.body.classList.remove("unreachable");
  });
  function unreachable() {
    // The one state the server cannot render, because the server is what is
    // unreachable. Saying so beats freezing on a stale screen: the two look
    // identical and mean opposite things.
    document.body.classList.add("unreachable");
  }
  // Ready means the Shell is serving, so a reload gets the real interface from
  // the front door. This page's job ends by getting out of the way rather than
  // by drawing a finished state.
  addEventListener("sse:ready", function () { location.reload(); });
</script>
</body>
</html>
